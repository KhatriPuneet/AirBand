name: Build Zenflow IPA for Sideloadly

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Build iOS Application (.app)
      run: |
        cd AirBand_iOS
        xcodebuild -project AirBand.xcodeproj \
          -scheme AirBand \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          archive -archivePath ./build/AirBand.xcarchive

    - name: Package into .ipa with Entitlements
      run: |
        cd AirBand_iOS
        mkdir -p Payload
        APP_PATH=$(find ./build/AirBand.xcarchive/Products/Applications -name "*.app" | head -n 1)
        cp -r "$APP_PATH" Payload/
        APP_DIR=$(find Payload -name "*.app" | head -n 1)
        
        # Copy entitlements into bundle root
        cp AirBand.entitlements "$APP_DIR/archived-expanded-entitlements.xcent"
        cp AirBand.entitlements "$APP_DIR/AirBand.entitlements"
        
        # Ad-hoc sign bundle with HealthKit entitlements
        codesign -s - --force --deep --entitlements AirBand.entitlements "$APP_DIR"
        
        # Verify embedded entitlements
        codesign -d --entitlements :- "$APP_DIR"
        
        zip -r Zenflow.ipa Payload
        cp Zenflow.ipa AirBand.ipa

    - name: Upload Zenflow.ipa Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zenflow-IPA
        path: AirBand_iOS/Zenflow.ipa
        retention-days: 7
